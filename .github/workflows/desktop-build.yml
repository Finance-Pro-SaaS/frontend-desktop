name: Finance Pro Desktop Build

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://finance-pro-xv5r.onrender.com/api

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      - name: Checkout desktop
        uses: actions/checkout@v4

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build web
        working-directory: frontend-web
        run: npm run build

      - name: Verify web build
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend-web/dist")) {
            throw "frontend-web/dist does not exist"
          }

      - name: Verify icons
        shell: pwsh
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            throw "build/icon.ico is missing"
          }

          if (-not (Test-Path "build/icon.png")) {
            throw "build/icon.png is missing"
          }

      - name: Install desktop dependencies
        run: npm ci

      - name: Build and publish Windows
        run: npx electron-builder --win --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist


  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout desktop
        uses: actions/checkout@v4

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build web
        working-directory: frontend-web
        run: npm run build

      - name: Verify web build
        run: |
          test -d frontend-web/dist

      - name: Verify icons
        run: |
          test -f build/icon.png
          test -f build/icon.ico

      - name: Install desktop dependencies
        run: npm ci

      - name: Build and publish Linux
        run: npx electron-builder --linux --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Show Linux artifacts
        run: |
          ls -lh dist