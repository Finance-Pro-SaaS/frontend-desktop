name: Finance Pro Desktop Build

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://finance-pro-xv5r.onrender.com/api

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend-desktop/package-lock.json
            frontend-web/package-lock.json

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build web
        working-directory: frontend-web
        run: npm run build

      - name: Verify web build
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend-web/dist")) {
            throw "frontend-web/dist does not exist"
          }

      - name: Verify icons
        working-directory: frontend-desktop
        shell: pwsh
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            throw "build/icon.ico is missing"
          }

          if (-not (Test-Path "build/icon.png")) {
            throw "build/icon.png is missing"
          }

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      - name: Rebuild native modules
        working-directory: frontend-desktop
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Windows
        working-directory: frontend-desktop
        run: npm run build:win

      - name: Publish Windows to R2
        working-directory: frontend-desktop
        run: npx electron-builder --win --publish always
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem frontend-desktop/dist


  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend-desktop/package-lock.json
            frontend-web/package-lock.json

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build web
        working-directory: frontend-web
        run: npm run build

      - name: Verify web build
        run: test -d frontend-web/dist

      - name: Verify icons
        working-directory: frontend-desktop
        run: |
          test -f build/icon.png
          test -f build/icon.ico

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      - name: Rebuild native modules
        working-directory: frontend-desktop
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Linux
        working-directory: frontend-desktop
        run: npm run build:linux

      - name: Publish Linux to R2
        working-directory: frontend-desktop
        run: npx electron-builder --linux --publish always
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Show artifacts
        run: |
          ls -lh frontend-desktop/dist