name: Finance Pro Desktop - Build

on:
  workflow_call:

    inputs:
      version:
        description: "Version Finance Pro Desktop à construire"
        required: true
        type: string

    secrets:
      R2_ACCESS_KEY_ID:
        required: true

      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://financepro-7rax.onrender.com/api

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      - name: Checkout Desktop
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Checkout Frontend Web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build Web
        working-directory: frontend-web
        run: npm run build

      - name: Prepare Web build for Electron
        shell: pwsh
        run: |
          $source = Join-Path $PWD "frontend-web/dist"
          $target = Join-Path (Split-Path $PWD -Parent) "frontend-web/dist"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force

      - name: Verify Web build
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend-web/dist")) {
            throw "frontend-web/dist does not exist"
          }

          if (-not (Test-Path "frontend-web/dist/index.html")) {
            throw "frontend-web/dist/index.html does not exist"
          }

          $packagingPath = Join-Path (Split-Path $PWD -Parent) "frontend-web/dist/index.html"
          if (-not (Test-Path $packagingPath)) {
            throw "Electron source frontend is missing: $packagingPath"
          }

          Write-Host "Frontend Web build OK."

      - name: Verify icons
        shell: pwsh
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            throw "build/icon.ico is missing"
          }

          if (-not (Test-Path "build/icon.png")) {
            throw "build/icon.png is missing"
          }

          Write-Host "Desktop icons OK."

      - name: Install Desktop dependencies
        run: npm ci

      - name: Verify Desktop version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"

          Write-Host "Expected version: ${{ inputs.version }}"
          Write-Host "Package version: $version"

          if ($version -ne "${{ inputs.version }}") {
            throw "Version mismatch."
          }

      - name: Build Windows package
        run: npx electron-builder --win --publish never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged frontend
        shell: pwsh
        run: |
          $indexPath = "dist/win-unpacked/resources/frontend-web/dist/index.html"

          if (-not (Test-Path $indexPath)) {
            throw "Packaged frontend is missing: $indexPath"
          }

          Write-Host "Packaged frontend OK: $indexPath"

      - name: Publish Windows to R2
        run: npx electron-builder --win --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show Windows artifacts
        shell: pwsh
        run: |
          Write-Host "Windows artifacts:"
          Get-ChildItem dist | Format-Table Name, Length


  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Desktop
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Checkout Frontend Web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build Web
        working-directory: frontend-web
        run: npm run build

      - name: Prepare Web build for Electron
        run: |
          mkdir -p ../frontend-web/dist
          cp -R frontend-web/dist/. ../frontend-web/dist/

      - name: Verify Web build
        run: |
          test -d frontend-web/dist
          test -f ../frontend-web/dist/index.html
          echo "Frontend Web build OK."

      - name: Verify icons
        run: |
          test -f build/icon.png
          test -f build/icon.ico
          echo "Desktop icons OK."

      - name: Install Desktop dependencies
        run: npm ci

      - name: Verify Desktop version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "Expected version: ${{ inputs.version }}"
          echo "Package version: $VERSION"

          if [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch."
            exit 1
          fi

      - name: Build and publish Linux to R2
        run: npx electron-builder --linux --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Show Linux artifacts
        run: |
          echo "Linux artifacts:"
          ls -lh dist