name: Finance Pro Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

env:
  # URL du backend en production. Les apps desktop installées chez les
  # utilisateurs n'ont PAS de serveur local — sans ceci le build utilise le
  # défaut du code (http://localhost:8000/api) et rien ne fonctionne une fois installé.
  VITE_API_BASE_URL: https://finance-pro-xv5r.onrender.com/api
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_AWS_SECRET_ACCESS_KEY }}

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout frontend-desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      - name: Checkout frontend-web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install frontend-web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build frontend-web
        working-directory: frontend-web
        run: npm run build

      - name: Verify frontend-web build
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend-web/dist")) { 
            Write-Error "frontend-web/dist was not generated." 
            exit 1 
          }
          Get-ChildItem "frontend-web/dist" | Select-Object Name

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      - name: Rebuild native modules for Electron
        working-directory: frontend-desktop
        run: npx electron-builder install-app-deps
        env:
          npm_config_target: 31.2.0
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true

      - name: Build and Publish Windows installer to R2
        working-directory: frontend-desktop
        run: npm run publish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "frontend-desktop/dist/*.exe" -ErrorAction SilentlyContinue
          if (-not $files) { 
            Write-Error "No Windows installer was generated in frontend-desktop/dist." 
            exit 1 
          }
          $files | Select-Object FullName, Length

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend-desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      - name: Checkout frontend-web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install frontend-web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build frontend-web
        working-directory: frontend-web
        run: npm run build

      - name: Verify frontend-web build
        run: test -d frontend-web/dist

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      - name: Rebuild native modules for Electron
        working-directory: frontend-desktop
        run: npx electron-builder install-app-deps
        env:
          npm_config_target: 31.2.0
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true

      - name: Build and Publish Linux AppImage to R2
        working-directory: frontend-desktop
        run: npm run publish
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Verify Linux package
        run: test -n "$(find frontend-desktop/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"