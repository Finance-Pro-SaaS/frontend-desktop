name: Finance Pro Desktop Build

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  # Backend Finance Pro utilisé par le frontend Web
  VITE_API_BASE_URL: https://finance-pro-xv5r.onrender.com/api

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      # ----------------------------------------------------------
      # Checkout Desktop
      # ----------------------------------------------------------

      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      # ----------------------------------------------------------
      # Checkout Frontend Web
      # ----------------------------------------------------------

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            frontend-desktop/package-lock.json
            frontend-web/package-lock.json

      # ----------------------------------------------------------
      # Installation Frontend Web
      # ----------------------------------------------------------

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      # ----------------------------------------------------------
      # Build Frontend Web
      # ----------------------------------------------------------

      - name: Build web
        working-directory: frontend-web
        run: npm run build

      # ----------------------------------------------------------
      # Vérification du build Web
      # ----------------------------------------------------------

      - name: Verify web build
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend-web/dist")) {
            throw "frontend-web/dist does not exist"
          }

          Write-Host "Frontend web build found successfully."

      # ----------------------------------------------------------
      # Vérification des icônes
      # ----------------------------------------------------------

      - name: Verify icons
        working-directory: frontend-desktop
        shell: pwsh
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            throw "build/icon.ico is missing"
          }

          if (-not (Test-Path "build/icon.png")) {
            throw "build/icon.png is missing"
          }

          Write-Host "Desktop icons found successfully."

      # ----------------------------------------------------------
      # Installation Desktop
      # ----------------------------------------------------------

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      # ----------------------------------------------------------
      # Vérification des identifiants R2
      #
      # IMPORTANT :
      # Les valeurs réelles ne sont jamais affichées.
      # Seules leurs longueurs sont vérifiées.
      # ----------------------------------------------------------

      - name: Verify R2 credentials
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:AWS_ACCESS_KEY_ID)) {
            throw "AWS_ACCESS_KEY_ID is empty"
          }

          if ([string]::IsNullOrEmpty($env:AWS_SECRET_ACCESS_KEY)) {
            throw "AWS_SECRET_ACCESS_KEY is empty"
          }

          Write-Host "R2 Access Key length: $($env:AWS_ACCESS_KEY_ID.Length)"
          Write-Host "R2 Secret Key length: $($env:AWS_SECRET_ACCESS_KEY.Length)"

          if ($env:AWS_ACCESS_KEY_ID.Length -ne 32) {
            throw "R2 Access Key ID does not have 32 characters"
          }

          if ($env:AWS_SECRET_ACCESS_KEY.Length -ne 64) {
            throw "R2 Secret Access Key does not have 64 characters"
          }

          Write-Host "R2 credentials format verified successfully."

      # ----------------------------------------------------------
      # Build + Publication Windows vers Cloudflare R2
      # ----------------------------------------------------------

      - name: Build and publish Windows to R2
        working-directory: frontend-desktop
        run: npx electron-builder --win --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ----------------------------------------------------------
      # Affichage des fichiers générés
      # ----------------------------------------------------------

      - name: Show Windows artifacts
        shell: pwsh
        run: |
          Write-Host "Windows artifacts:"
          Get-ChildItem frontend-desktop/dist |
            Format-Table Name, Length


  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout Desktop
      # ----------------------------------------------------------

      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      # ----------------------------------------------------------
      # Checkout Frontend Web
      # ----------------------------------------------------------

      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            frontend-desktop/package-lock.json
            frontend-web/package-lock.json

      # ----------------------------------------------------------
      # Installation Frontend Web
      # ----------------------------------------------------------

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      # ----------------------------------------------------------
      # Build Frontend Web
      # ----------------------------------------------------------

      - name: Build web
        working-directory: frontend-web
        run: npm run build

      # ----------------------------------------------------------
      # Vérification du build Web
      # ----------------------------------------------------------

      - name: Verify web build
        run: |
          if [ ! -d "frontend-web/dist" ]; then
            echo "frontend-web/dist does not exist"
            exit 1
          fi

          echo "Frontend web build found successfully."

      # ----------------------------------------------------------
      # Vérification des icônes
      # ----------------------------------------------------------

      - name: Verify icons
        working-directory: frontend-desktop
        run: |
          if [ ! -f "build/icon.png" ]; then
            echo "build/icon.png is missing"
            exit 1
          fi

          if [ ! -f "build/icon.ico" ]; then
            echo "build/icon.ico is missing"
            exit 1
          fi

          echo "Desktop icons found successfully."

      # ----------------------------------------------------------
      # Installation Desktop
      # ----------------------------------------------------------

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      # ----------------------------------------------------------
      # Vérification des identifiants R2
      #
      # IMPORTANT :
      # Les valeurs réelles ne sont jamais affichées.
      # Seules leurs longueurs sont vérifiées.
      # ----------------------------------------------------------

      - name: Verify R2 credentials
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS_ACCESS_KEY_ID is empty"
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS_SECRET_ACCESS_KEY is empty"
            exit 1
          fi

          echo "R2 Access Key length: ${#AWS_ACCESS_KEY_ID}"
          echo "R2 Secret Key length: ${#AWS_SECRET_ACCESS_KEY}"

          if [ "${#AWS_ACCESS_KEY_ID}" -ne 32 ]; then
            echo "R2 Access Key ID does not have 32 characters"
            exit 1
          fi

          if [ "${#AWS_SECRET_ACCESS_KEY}" -ne 64 ]; then
            echo "R2 Secret Access Key does not have 64 characters"
            exit 1
          fi

          echo "R2 credentials format verified successfully."

      # ----------------------------------------------------------
      # Build + Publication Linux vers Cloudflare R2
      # ----------------------------------------------------------

      - name: Build and publish Linux to R2
        working-directory: frontend-desktop
        run: npx electron-builder --linux --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # ----------------------------------------------------------
      # Affichage des fichiers générés
      # ----------------------------------------------------------

      - name: Show Linux artifacts
        run: |
          echo "Linux artifacts:"
          ls -lh frontend-desktop/dist