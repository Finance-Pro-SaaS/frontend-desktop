name: Finance Pro Desktop Build

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://finance-pro-xv5r.onrender.com/api

jobs:

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:

      - name: Checkout frontend-desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      - name: Checkout frontend-web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend-web/package-lock.json
            frontend-desktop/package-lock.json

      - name: Show versions
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Verify desktop icons
        shell: pwsh
        working-directory: frontend-desktop
        run: |
          if (-not (Test-Path "build/icon.ico")) {
            Write-Error "Missing build/icon.ico"
            exit 1
          }

          if (-not (Test-Path "build/icon.png")) {
            Write-Error "Missing build/icon.png"
            exit 1
          }

          Write-Host "Windows icon:"
          Get-Item "build/icon.ico" | Select-Object Name, Length

          Write-Host "Linux icon:"
          Get-Item "build/icon.png" | Select-Object Name, Length

      - name: Install frontend-web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build frontend-web
        working-directory: frontend-web
        run: npm run build

      - name: Verify frontend-web build
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend-web/dist")) {
            Write-Error "frontend-web/dist was not generated."
            exit 1
          }

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron
        working-directory: frontend-desktop
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build and publish Windows
        working-directory: frontend-desktop
        run: npm run publish
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.R2_AWS_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_AWS_SECRET_ACCESS_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem "frontend-desktop/dist" -ErrorAction SilentlyContinue

          if (-not $files) {
            Write-Error "No artifacts were generated."
            exit 1
          }

          $files | Select-Object Name, Length


  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest

    steps:

      - name: Checkout frontend-desktop
        uses: actions/checkout@v4
        with:
          path: frontend-desktop

      - name: Checkout frontend-web
        uses: actions/checkout@v4
        with:
          repository: Finance-Pro-SaaS/frontend-web
          path: frontend-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend-web/package-lock.json
            frontend-desktop/package-lock.json

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Verify desktop icons
        working-directory: frontend-desktop
        run: |
          test -f build/icon.png
          test -f build/icon.ico

          echo "Icons found:"
          ls -lh build/icon.*

      - name: Install frontend-web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Build frontend-web
        working-directory: frontend-web
        run: npm run build

      - name: Verify frontend-web build
        run: test -d frontend-web/dist

      - name: Install desktop dependencies
        working-directory: frontend-desktop
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron
        working-directory: frontend-desktop
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build and publish Linux
        working-directory: frontend-desktop
        run: npm run publish
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.R2_AWS_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_AWS_SECRET_ACCESS_KEY }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Verify Linux artifacts
        run: |
          test -n "$(find frontend-desktop/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

          echo "Linux artifacts:"
          ls -lh frontend-desktop/dist