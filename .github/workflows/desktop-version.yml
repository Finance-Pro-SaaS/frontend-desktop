name: Finance Pro Desktop - Version automatique

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  version:
    name: Calculer et créer la nouvelle version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Lire la version actuelle
        id: current
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "Version actuelle : $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Calculer la prochaine version
        id: next
        shell: bash
        run: |
          CURRENT="${{ steps.current.outputs.version }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$PATCH" -lt 99 ]; then
            PATCH=$((PATCH + 1))

          elif [ "$MINOR" -lt 99 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0

          else
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          fi

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEXT}"

          echo "Nouvelle version : $NEXT"
          echo "Nouveau tag : $TAG"

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour package.json et package-lock.json
        run: |
          npm version "${{ steps.next.outputs.version }}" --no-git-tag-version

      - name: Vérifier la nouvelle version
        run: |
          node -p "require('./package.json').version"

      - name: Commit et tag
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          git commit -m "chore: release ${TAG}"

          git tag -a "${TAG}" -m "Finance Pro Desktop ${TAG}"

          git push origin main
          git push origin "${TAG}"

  build:
    name: Build Windows + Linux
    needs: version

    uses: Finance-Pro-SaaS/frontend-desktop/.github/workflows/desktop-build.yml@main

    with:
      version: ${{ needs.version.outputs.version }}

    secrets: inherit